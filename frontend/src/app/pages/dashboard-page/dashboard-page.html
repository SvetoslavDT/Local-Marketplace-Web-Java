<app-top-bar></app-top-bar>

<div class="dashboard">

  <app-filter-sidebar
    (search)="onSearch($event)">
  </app-filter-sidebar>

  <div class="results">

    @if (products().length > 0) {
      <div class="grid">
        @for (p of products(); track p.id) {
          <app-product-card [product]="p"></app-product-card>
        }
      </div>
    }

    @if (events().length > 0) {
      <div class="grid">
        @for (e of events(); track e.id) {
          <app-event-card [event]="e"></app-event-card>
        }
      </div>
    }

  </div>

</div>
