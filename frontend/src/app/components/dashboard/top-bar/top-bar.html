<div class="top-bar">
  <!-- LEFT SIDE -->
  <div class="left-side">
    <div class="username">
      {{ username() }}
    </div>

    @if (isVendor()) {
      <button
        mat-button
        class="post-product-btn"
        (click)="onPostProduct()"
      >
        Post product
      </button>
    }
  </div>

  <!-- RIGHT SIDE -->
  <div class="right-side">
    <button
      mat-button
      class="orders-btn"
      (click)="onOrders()"
    >
      Orders
    </button>

    <button
      mat-icon-button
      (click)="onCart()"
      [matBadge]="cartItemCount()"
      [matBadgeHidden]="cartItemCount() === 0"
      matBadgeColor="warn"
      matBadgePosition="above after"
    >
      <mat-icon>shopping_cart</mat-icon>
    </button>
  </div>
</div>
