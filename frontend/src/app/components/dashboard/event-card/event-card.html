<a class="entity-card" [routerLink]="['/events', event().id]">
  <div class="content">
    <div class="name">{{ event().title }}</div>

    <div class="meta">
      @if (event().startDate) {
        <span>Start: {{ formatDate(event().startDate!) }}</span>
      }
      @if (event().endDate) {
        <span>End: {{ formatDate(event().endDate!) }}</span>
      }
    </div>
  </div>
</a>
