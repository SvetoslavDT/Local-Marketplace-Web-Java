<div class="entity-card">
  <a class="card-link" [routerLink]="['/products', product().id]">
    <div class="image-box">
      @if (product().productPicturePath) {
        <img
          class="product-image"
          [src]="'/files?path=' + product().productPicturePath"
          [alt]="product().name"
        />
      } @else {
        <div class="image-placeholder">No image</div>
      }
    </div>

    <div class="content">
      <div class="name">{{ product().name }}</div>

      <div class="meta">
        <span class="price">Price: {{ formatPrice(product().price) }}</span>
        <span class="quantity">Qty: {{ product().quantity }}</span>
      </div>
    </div>
  </a>

  <button class="btn-add-cart" type="button" (click)="onAddToCart()">Add to cart</button>
</div>
